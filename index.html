<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #070b1c; --bg2: #18224a; --ink: #d4dcff; --soft: rgba(212,220,255,.62); --line: rgba(212,220,255,.16);
    --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
    --text: "Figtree", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body[data-phase="dawn"]  { --bg1:#27346a; --bg2:#e3957a; --ink:#fff3ea; --soft:rgba(255,243,234,.72); --line:rgba(255,243,234,.22); }
  body[data-phase="day"]   { --bg1:#7cc4df; --bg2:#d9ecd0; --ink:#0f2a3c; --soft:rgba(15,42,60,.66); --line:rgba(15,42,60,.16); }
  body[data-phase="dusk"]  { --bg1:#1b2152; --bg2:#93507c; --ink:#ffeaf4; --soft:rgba(255,234,244,.7); --line:rgba(255,234,244,.2); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink); font-family: var(--text);
    transition: background 2s, color 2s;
    padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  body[data-phase="night"] main { opacity: .8; }
  main {
    height: 100%; display: grid; grid-template-columns: 1.55fr 1fr; gap: 4vw;
    padding: 5vh 4.5vw; transition: transform 3s, opacity 2s;
  }
  .left { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .time {
    font-family: var(--display); font-weight: 800; line-height: .82; letter-spacing: -.01em;
    font-size: min(27vw, 56vh); display: flex; align-items: flex-start; white-space: nowrap;
  }
  .time .d { display: inline-block; width: .5em; text-align: center; }
  .time .colon { display: inline-block; width: .22em; text-align: center; transform: translateY(-.04em); opacity: .85; }
  .ampm { font-family: var(--display); font-weight: 500; font-size: .2em; margin: .12em 0 0 .15em; opacity: .7; }
  .sec { height: 3px; background: var(--line); margin: 3.5vh 0 3vh; border-radius: 2px; max-width: 92%; overflow: hidden; }
  .sec i { display: block; height: 100%; width: 0; background: var(--ink); opacity: .55; transition: width .9s linear; }
  .date { font-size: min(4.4vw, 7.5vh); font-weight: 600; line-height: 1.1; }
  .sky { margin-top: 1.6vh; font-size: min(2.2vw, 3.8vh); color: var(--soft); line-height: 1.5; }

  .zone { margin-top: 2.4vh; display: flex; align-items: baseline; gap: .7em; font-size: min(1.9vw, 3.3vh); color: var(--soft); }
  .zone b { font-family: var(--display); font-weight: 500; font-size: 1.45em; letter-spacing: .02em; color: var(--ink); opacity: .85; }
  .zone::before { content: ""; width: 1.6em; height: 1px; background: var(--soft); opacity: .6; align-self: center; }

  .right { display: flex; flex-direction: column; justify-content: center; gap: 3.2vh; min-width: 0; }
  .place { background: none; border: 0; color: var(--soft); font: inherit; font-size: min(1.9vw, 3.3vh); text-align: left; padding: 0; cursor: pointer; }
  .now { display: flex; align-items: center; gap: 1.6vw; }
  .now svg { width: min(10vw, 17vh); height: min(10vw, 17vh); flex: none; }
  .temp { font-family: var(--display); font-weight: 800; font-size: min(10vw, 18vh); line-height: .85; }
  .cond { font-size: min(2.3vw, 4vh); font-weight: 600; }
  .stats { font-size: min(1.75vw, 3vh); color: var(--soft); line-height: 1.55; }
  .hours { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 1.8vh 0; text-align: center; }
  .hours div { font-size: min(1.6vw, 2.8vh); color: var(--soft); }
  .hours svg { width: min(3.2vw, 5.5vh); height: min(3.2vw, 5.5vh); display: block; margin: .6vh auto; color: var(--ink); }
  .hours b { color: var(--ink); font-weight: 600; font-size: min(1.9vw, 3.3vh); }
  .days { display: grid; gap: 1.2vh; }
  .day { display: grid; grid-template-columns: 4.5em 2em 1fr auto; align-items: center; gap: .8em; font-size: min(1.9vw, 3.3vh); }
  .day svg { width: 1.6em; height: 1.6em; }
  .day .rain { color: var(--soft); font-size: .85em; }
  .day .hl b { font-weight: 600; } .day .hl span { color: var(--soft); margin-left: .5em; }
  .status { font-size: min(1.75vw, 3vh); color: var(--soft); }

  .gear { position: fixed; right: 1.5vw; bottom: 1.5vh; background: none; border: 0; color: var(--soft); opacity: .45; padding: 1em; cursor: pointer; }
  .gear svg { width: 26px; height: 26px; }

  dialog { border: 0; border-radius: 18px; padding: 28px; width: min(520px, 92vw); background: #fbfcff; color: #14203a; font-family: var(--text); }
  dialog::backdrop { background: rgba(5,8,20,.6); }
  dialog h2 { font-size: 22px; margin-bottom: 16px; }
  dialog label { display: block; font-size: 15px; font-weight: 600; margin: 16px 0 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  dialog input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px 14px; border: 1.5px solid #c5cde0; border-radius: 10px; }
  dialog button { font: inherit; font-size: 17px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #c5cde0; background: #fff; color: #14203a; cursor: pointer; }
  dialog button.on, dialog button.primary { background: #1f3f8f; border-color: #1f3f8f; color: #fff; }
  .results { display: grid; gap: 6px; margin-top: 8px; }
  .results button { text-align: left; }
  .msg { font-size: 15px; color: #5a6480; margin-top: 8px; min-height: 1.2em; }
  button:focus-visible { outline: 3px solid #6d8cff; outline-offset: 2px; }

  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; align-content: center; }
    .time { font-size: 30vw; }
    .date { font-size: 6vw; } .sky, .stats, .place, .hours div, .day { font-size: 3.2vw; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-phase="night">
<main id="main">
  <section class="left">
    <div class="time" id="time" role="timer" aria-live="off"></div>
    <div class="sec"><i id="sec"></i></div>
    <div class="date" id="date"></div>
    <div class="sky" id="sky"></div>
    <div class="zone"><span>Mumbai</span><b id="mumbai"></b><span id="mumbaiDay"></span></div>
  </section>
  <section class="right">
    <button class="place" id="place" type="button">Set your location</button>
    <div class="now">
      <span id="nowIcon"></span>
      <div>
        <div class="temp" id="temp">--°</div>
        <div class="cond" id="cond"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hours" id="hours"></div>
    <div class="days" id="days"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<button class="gear" id="gear" type="button" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
</button>

<dialog id="dlg">
  <h2>Settings</h2>
  <label for="city">Location</label>
  <div class="row">
    <input id="city" placeholder="City or town" autocomplete="off">
    <button class="primary" id="find" type="button">Find</button>
  </div>
  <div class="row" style="margin-top:8px"><button id="geo" type="button">Use this device’s location</button></div>
  <div class="results" id="results"></div>
  <div class="msg" id="msg"></div>
  <label>Temperature</label>
  <div class="row"><button data-unit="F" type="button">°F</button><button data-unit="C" type="button">°C</button></div>
  <label>Clock</label>
  <div class="row"><button data-h24="0" type="button">12-hour</button><button data-h24="1" type="button">24-hour</button></div>
  <div class="row" style="margin-top:24px; justify-content:flex-end"><button class="primary" id="done" type="button">Done</button></div>
</dialog>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const KEY = "echo-clock-settings";
  const usLike = /^en-(US|LR)|^my/.test(navigator.language || "");
  let S = { lat: null, lon: null, name: "", unit: usLike ? "F" : "C", h24: !usLike };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  let W = null, sun = { rise: 420, set: 1080, riseTxt: "", setTxt: "" }, retry = null;

  /* ---------- Icons ---------- */
  const cloud = '<path d="M20 48h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3A11.5 11.5 0 0 0 20 48z"/>';
  const ICONS = {
    clearD: '<circle cx="32" cy="32" r="11"/><path d="M32 8v7M32 49v7M8 32h7M49 32h7M15 15l5 5M44 44l5 5M15 49l5-5M44 20l5-5"/>',
    clearN: '<path d="M40 12a20 20 0 1 0 12 30A16 16 0 0 1 40 12z"/>',
    partD: '<circle cx="24" cy="22" r="8"/><path d="M24 6v4M8 22h4M12.7 10.7l2.8 2.8M35.3 10.7l-2.8 2.8"/><path d="M24 52h22a9 9 0 0 0 1-18 12 12 0 0 0-23-2A10 10 0 0 0 24 52z"/>',
    partN: '<path d="M28 8a13 13 0 1 0 8 20A11 11 0 0 1 28 8z"/><path d="M24 54h22a9 9 0 0 0 1-18 12 12 0 0 0-23-2A10 10 0 0 0 24 54z"/>',
    cloud: cloud,
    fog: '<path d="M10 24h44M14 34h36M10 44h44M18 54h28"/>',
    rain: '<path d="M20 40h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3A11.5 11.5 0 0 0 20 40z"/><path d="M22 47l-3 8M33 47l-3 8M44 47l-3 8"/>',
    snow: '<path d="M20 40h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3A11.5 11.5 0 0 0 20 40z"/><circle cx="22" cy="50" r="1.6"/><circle cx="32" cy="54" r="1.6"/><circle cx="42" cy="50" r="1.6"/>',
    storm: '<path d="M20 38h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3A11.5 11.5 0 0 0 20 38z"/><path d="M34 40l-6 10h7l-4 9"/>'
  };
  function kind(c, day) {
    if (c === 0) return day ? "clearD" : "clearN";
    if (c <= 2) return day ? "partD" : "partN";
    if (c === 3) return "cloud";
    if (c === 45 || c === 48) return "fog";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    if (c >= 95) return "storm";
    return "rain";
  }
  const icon = (c, day) => '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + ICONS[kind(c, day)] + '</svg>';
  const DESC = { 0:"Clear", 1:"Mostly clear", 2:"Partly cloudy", 3:"Overcast", 45:"Fog", 48:"Freezing fog",
    51:"Light drizzle", 53:"Drizzle", 55:"Heavy drizzle", 56:"Freezing drizzle", 57:"Freezing drizzle",
    61:"Light rain", 63:"Rain", 65:"Heavy rain", 66:"Freezing rain", 67:"Freezing rain",
    71:"Light snow", 73:"Snow", 75:"Heavy snow", 77:"Snow grains", 80:"Showers", 81:"Showers", 82:"Heavy showers",
    85:"Snow showers", 86:"Heavy snow showers", 95:"Thunderstorms", 96:"Thunderstorms, hail", 99:"Thunderstorms, hail" };

  /* ---------- Time helpers ---------- */
  function fmtHM(h, m, short) {
    if (S.h24) return String(h).padStart(2, "0") + (short ? "" : ":" + String(m).padStart(2, "0"));
    const ap = h < 12 ? "AM" : "PM", hh = h % 12 || 12;
    return short ? hh + " " + ap : hh + ":" + String(m).padStart(2, "0") + " " + ap;
  }
  const parseHM = s => { const t = s.slice(11, 16).split(":"); return [+t[0], +t[1]]; };

  function moon(now) {
    const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
    const age = (((now - ref) / 86400000) % syn + syn) % syn, f = age / syn;
    const lit = Math.round((1 - Math.cos(2 * Math.PI * f)) / 2 * 100);
    const names = ["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"];
    return names[Math.floor(f * 8 + 0.5) % 8] + ", " + lit + "% lit";
  }

  /* ---------- Clock ---------- */
  let lastMin = -1;
  function tick() {
    const now = new Date(), h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    $("sec").style.width = (s / 59 * 100) + "%";
    if (m !== lastMin) {
      lastMin = m;
      let hh = S.h24 ? String(h).padStart(2, "0") : String(h % 12 || 12);
      const digits = (hh + ":" + String(m).padStart(2, "0")).split("");
      const t = $("time"); t.textContent = "";
      digits.forEach(ch => { const sp = document.createElement("span"); sp.className = ch === ":" ? "colon" : "d"; sp.textContent = ch; t.appendChild(sp); });
      if (!S.h24) { const ap = document.createElement("span"); ap.className = "ampm"; ap.textContent = h < 12 ? "AM" : "PM"; t.appendChild(ap); }
      $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      updatePhase(h * 60 + m);
      updateSky(now, h * 60 + m);
      updateMumbai(now);
      if (m % 5 === 0) { const x = (Math.random() * 8 - 4) | 0, y = (Math.random() * 8 - 4) | 0; $("main").style.transform = "translate(" + x + "px," + y + "px)"; }
    }
    setTimeout(tick, 1000 - now.getMilliseconds() + 5);
  }
  function updateMumbai(now) {
    try {
      const tz = "Asia/Kolkata";
      $("mumbai").textContent = now.toLocaleTimeString(undefined, { timeZone: tz, hour: "numeric", minute: "2-digit", hour12: !S.h24 });
      const there = now.toLocaleDateString("en-CA", { timeZone: tz }), here = now.toLocaleDateString("en-CA");
      $("mumbaiDay").textContent = there > here ? "tomorrow" : there < here ? "yesterday" : "";
    } catch (e) {
      const t = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 330 * 60000);
      $("mumbai").textContent = fmtHM(t.getHours(), t.getMinutes());
    }
  }
  function updatePhase(min) {
    let p = "night";
    if (min >= sun.rise - 40 && min < sun.rise + 40) p = "dawn";
    else if (min >= sun.rise + 40 && min < sun.set - 40) p = "day";
    else if (min >= sun.set - 40 && min < sun.set + 40) p = "dusk";
    document.body.dataset.phase = p;
  }
  function updateSky(now, min) {
    const parts = [];
    if (sun.riseTxt) parts.push(min < sun.rise || min > sun.set ? "Sunrise " + sun.riseTxt : "Sunset " + sun.setTxt);
    parts.push(moon(now));
    $("sky").textContent = parts.join("  ·  ");
  }

  /* ---------- Weather ---------- */
  async function loadWeather() {
    clearTimeout(retry);
    if (S.lat == null) { $("status").textContent = "Tap ‘Set your location’ to see the weather."; return; }
    const u = "https://api.open-meteo.com/v1/forecast?latitude=" + S.lat + "&longitude=" + S.lon +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m" +
      "&hourly=temperature_2m,weather_code,precipitation_probability,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max" +
      "&timezone=auto&forecast_days=6" +
      (S.unit === "F" ? "&temperature_unit=fahrenheit&wind_speed_unit=mph" : "&wind_speed_unit=kmh");
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error(r.status);
      W = await r.json();
      renderWeather();
      $("status").textContent = "";
      retry = setTimeout(loadWeather, 15 * 60 * 1000);
    } catch (e) {
      $("status").textContent = "Weather didn’t load. Trying again in 2 minutes.";
      retry = setTimeout(loadWeather, 2 * 60 * 1000);
    }
  }
  function renderWeather() {
    const c = W.current, d = W.daily, h = W.hourly, deg = "°";
    $("place").textContent = S.name || "Your location";
    $("nowIcon").innerHTML = icon(c.weather_code, c.is_day);
    $("temp").textContent = Math.round(c.temperature_2m) + deg;
    $("cond").textContent = DESC[c.weather_code] || "";
    const wind = S.unit === "F" ? " mph" : " km/h";
    $("stats").textContent = "Feels like " + Math.round(c.apparent_temperature) + deg +
      "   High " + Math.round(d.temperature_2m_max[0]) + deg + "  Low " + Math.round(d.temperature_2m_min[0]) + deg +
      "\u2002\u00b7\u2002Humidity " + c.relative_humidity_2m + "%\u2002\u00b7\u2002Wind " + Math.round(c.wind_speed_10m) + wind +
      "\u2002\u00b7\u2002UV " + Math.round(d.uv_index_max[0]);

    const [rh, rm] = parseHM(d.sunrise[0]), [sh, sm] = parseHM(d.sunset[0]);
    sun = { rise: rh * 60 + rm, set: sh * 60 + sm, riseTxt: fmtHM(rh, rm), setTxt: fmtHM(sh, sm) };
    const now = new Date(); updatePhase(now.getHours() * 60 + now.getMinutes()); updateSky(now, now.getHours() * 60 + now.getMinutes());

    const hours = $("hours"); hours.textContent = "";
    let i = h.time.indexOf(c.time.slice(0, 13) + ":00");
    if (i < 0) i = 0;
    for (let k = i + 1; k <= i + 6 && k < h.time.length; k++) {
      const cell = document.createElement("div");
      const lab = document.createElement("div"); lab.textContent = fmtHM(+h.time[k].slice(11, 13), 0, true);
      const ic = document.createElement("span"); ic.innerHTML = icon(h.weather_code[k], h.is_day[k]);
      const t = document.createElement("b"); t.textContent = Math.round(h.temperature_2m[k]) + deg;
      cell.append(lab, ic, t); hours.appendChild(cell);
    }

    const days = $("days"); days.textContent = "";
    for (let k = 1; k <= 4 && k < d.time.length; k++) {
      const row = document.createElement("div"); row.className = "day";
      const n = document.createElement("span"); n.textContent = new Date(d.time[k] + "T12:00").toLocaleDateString(undefined, { weekday: "short" });
      const ic = document.createElement("span"); ic.innerHTML = icon(d.weather_code[k], 1);
      const rain = document.createElement("span"); rain.className = "rain";
      const p = d.precipitation_probability_max[k]; rain.textContent = p >= 20 ? p + "% chance of rain" : "";
      const hl = document.createElement("span"); hl.className = "hl";
      const hi = document.createElement("b"); hi.textContent = Math.round(d.temperature_2m_max[k]) + deg;
      const lo = document.createElement("span"); lo.textContent = Math.round(d.temperature_2m_min[k]) + deg;
      hl.append(hi, lo); row.append(n, ic, rain, hl); days.appendChild(row);
    }
  }

  /* ---------- Settings ---------- */
  const dlg = $("dlg");
  function syncToggles() {
    dlg.querySelectorAll("[data-unit]").forEach(b => b.classList.toggle("on", b.dataset.unit === S.unit));
    dlg.querySelectorAll("[data-h24]").forEach(b => b.classList.toggle("on", (b.dataset.h24 === "1") === S.h24));
  }
  function openSettings() { syncToggles(); $("msg").textContent = S.name ? "Current: " + S.name : ""; $("results").textContent = ""; if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); }
  function closeSettings() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  function choose(lat, lon, name) { S.lat = +lat.toFixed(3); S.lon = +lon.toFixed(3); S.name = name; save(); $("place").textContent = name; $("msg").textContent = "Current: " + name; $("results").textContent = ""; loadWeather(); }

  async function find() {
    const q = $("city").value.trim(); if (!q) return;
    $("msg").textContent = "Searching…"; $("results").textContent = "";
    try {
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&name=" + encodeURIComponent(q));
      const j = await r.json();
      if (!j.results || !j.results.length) { $("msg").textContent = "No places found. Check the spelling or try a nearby city."; return; }
      $("msg").textContent = "Pick your place:";
      j.results.forEach(p => {
        const b = document.createElement("button"); b.type = "button";
        const label = [p.name, p.admin1, p.country].filter(Boolean).join(", ");
        b.textContent = label;
        b.onclick = () => choose(p.latitude, p.longitude, p.admin1 ? p.name + ", " + p.admin1 : p.name);
        $("results").appendChild(b);
      });
    } catch (e) { $("msg").textContent = "Search didn’t connect. Check the Wi-Fi and try again."; }
  }
  $("find").onclick = find;
  $("city").addEventListener("keydown", e => { if (e.key === "Enter") find(); });
  $("geo").onclick = () => {
    if (!navigator.geolocation) { $("msg").textContent = "This browser can’t share location. Search for your city instead."; return; }
    $("msg").textContent = "Finding your location…";
    navigator.geolocation.getCurrentPosition(
      p => choose(p.coords.latitude, p.coords.longitude, "Your location"),
      () => { $("msg").textContent = "Location wasn’t shared. Search for your city instead."; },
      { timeout: 15000 });
  };
  dlg.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => { S.unit = b.dataset.unit; save(); syncToggles(); loadWeather(); });
  dlg.querySelectorAll("[data-h24]").forEach(b => b.onclick = () => { S.h24 = b.dataset.h24 === "1"; save(); syncToggles(); lastMin = -1; if (W) renderWeather(); });
  $("done").onclick = closeSettings;
  $("gear").onclick = openSettings;
  $("place").onclick = openSettings;

  /* Tap the clock to go full screen */
  $("time").addEventListener("click", () => {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
  });
  /* Keep the screen awake where supported */
  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { wake(); loadWeather(); } });

  tick(); wake(); loadWeather();
  if (S.lat == null) setTimeout(openSettings, 600);
})();
</script>
</body>
</html>
